{% extends "base.html" %}
{% block title %}Edit Task · StudyFlow{% endblock %}
{% block content %}
<section class="edit-page">
  <a class="back-link" href="{{ url_for('index') }}">← Back to planner</a>
  <div class="edit-card">
    <div class="add-heading"><span class="add-icon">✎</span><div><p class="eyebrow">REFINE YOUR PLAN</p><h2>Edit task</h2></div></div>
    <form class="task-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="title">Task name</label><input id="title" name="title" maxlength="120" value="{{ task.title }}" required>
      <label for="subject">Subject</label><input id="subject" name="subject" maxlength="60" value="{{ task.subject }}">
      <div class="form-row"><div><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" value="{{ task.due_date.isoformat() if task.due_date else '' }}"></div><div><label for="priority">Priority</label><select id="priority" name="priority"><option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option><option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option><option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option></select></div></div>
      <div class="edit-actions"><a class="cancel-button" href="{{ url_for('index') }}">Cancel</a><button class="submit-button" type="submit">Save changes <span>→</span></button></div>
    </form>
  </div>
</section>
{% endblock %}
