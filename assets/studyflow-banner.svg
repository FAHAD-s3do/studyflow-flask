<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#090B13"/><stop offset=".55" stop-color="#15112A"/><stop offset="1" stop-color="#071B21"/></linearGradient>
    <linearGradient id="word" x1="190" y1="120" x2="770" y2="235" gradientUnits="userSpaceOnUse"><stop stop-color="#C4B5FD"><animate attributeName="stop-color" values="#C4B5FD;#67E8F9;#C4B5FD" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#5EEAD4"><animate attributeName="stop-color" values="#5EEAD4;#A78BFA;#5EEAD4" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8B5CF6" stop-opacity=".27"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#A5B4FC" stroke-opacity=".09" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="26" fill="url(#grid)"/>
  <ellipse cx="930" cy="190" rx="310" ry="230" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1030" cy="170" r="102" stroke="#A78BFA" stroke-opacity=".2"/>
  <circle cx="1030" cy="170" r="75" stroke="#67E8F9" stroke-opacity=".28" stroke-dasharray="4 9">
    <animateTransform attributeName="transform" type="rotate" from="0 1030 170" to="360 1030 170" dur="32s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="68" r="5" fill="#C4B5FD"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1105" cy="170" r="4" fill="#5EEAD4"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
  <g transform="translate(875 112)">
    <rect width="170" height="116" rx="18" fill="#111827" stroke="#A78BFA" stroke-opacity=".45"/>
    <rect x="16" y="17" width="138" height="8" rx="4" fill="#64748B" fill-opacity=".35"/>
    <rect x="16" y="39" width="84" height="7" rx="3.5" fill="#C4B5FD" fill-opacity=".8"/>
    <rect x="16" y="58" width="138" height="6" rx="3" fill="#64748B" fill-opacity=".28"/>
    <rect x="16" y="76" width="138" height="6" rx="3" fill="#64748B" fill-opacity=".28"/>
    <rect x="16" y="94" width="95" height="6" rx="3" fill="#5EEAD4" fill-opacity=".7"/>
    <path d="M16 94H16"><animate attributeName="d" values="M16 94H16;M16 94H95;M16 94H16" dur="3s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#C4B5FD" opacity=".7"><circle cx="810" cy="80" r="2"/><circle cx="1155" cy="265" r="2"/><circle cx="850" cy="290" r="3"/><circle cx="1120" cy="65" r="2"/></g>
  <text x="82" y="88" fill="#A5B4FC" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">A PERSONAL WORKSPACE FOR LEARNING</text>
  <text x="78" y="190" fill="url(#word)" font-family="Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-3">StudyFlow</text>
  <text x="84" y="235" fill="#E2E8F0" font-family="Arial,sans-serif" font-size="21">Plan smarter. Focus deeper. Make progress visible.</text>
  <rect x="84" y="275" width="190" height="34" rx="17" fill="#8B5CF6" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".55"/>
  <circle cx="104" cy="292" r="4" fill="#5EEAD4"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="118" y="297" fill="#DDD6FE" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FOCUS • TRACK • GROW</text>
  <text x="84" y="345" fill="#64748B" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">PYTHON  /  FLASK  /  SQLALCHEMY</text>
</svg>